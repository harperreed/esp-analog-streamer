[package]
name = "esp-shazam-mp3"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[features]
encoder-probe = []

[build-dependencies]
cc = "=1.6.0"

[target.'cfg(target_os = "espidf")'.dependencies]
