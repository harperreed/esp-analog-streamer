# ABOUTME: Measures default-feature host Rust coverage on isolated GitHub runners.
# ABOUTME: Retains reports and failure logs without building firmware or accessing devices.
name: Host Rust coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap mise only
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.9.15'
          install: false
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false
          persist_github_token: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev ffmpeg
      - name: Install pinned host executables
        run: |
          mise trust mise.toml
          mise install
          mise --version
      - name: Check coverage wrapper
        run: scripts/test-coverage-host
      - name: Measure host coverage
        run: scripts/coverage-host
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/coverage-host/run.*/reports/
            target/coverage-host/run.*/*.log
          retention-days: 7
          if-no-files-found: warn
