# ABOUTME: Replays production streaming decisions and validates exact decoded audio on every PR.
# ABOUTME: Retains source-accounting, decoder and negative-control evidence without device access.
name: Deterministic stream replay

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap mise only
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.9.15'
          install: false
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false
          persist_github_token: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev ffmpeg
          mise trust mise.toml
          mise install
          mise install uv@0.12.19
      - name: Check the audio oracle
        run: mise exec uv@0.12.19 -- scripts/test-replay-stream
      - name: Replay production streaming scenarios
        run: mise exec uv@0.12.19 -- scripts/check-stream-replay
      - name: Retain replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/stream-replay.*/
          retention-days: 7
          if-no-files-found: warn
