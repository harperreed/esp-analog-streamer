[package]
name = "esp-shazam-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Pure logic shared by the esp-shazam firmware and its Mac tools"
publish = false

[features]
encoder-probe = ["esp-shazam-mp3/encoder-probe"]
capture-fixture = []
capture-loom = ["dep:loom"]
listener-loom = ["dep:loom"]

[target.'cfg(not(target_os = "espidf"))'.dependencies]
loom = { version = "=0.7.2", optional = true }

[dependencies]
base64 = "0.22"
byteorder = "1.3.4"
chfft = "0.3.4"
crc32fast = "1.2.0"
libc = "=0.2.190"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
esp-shazam-mp3 = { path = "../mp3" }
proptest = "=1.11.0"
# The FLAC encoder's tests decode with it (ffmpeg is the other decoder); it reads 24-bit streams.
claxon = "=0.4.3"
hound = "3.5"
# The stream's write-deadline tests fix their sockets' buffer sizes, which std can't set.
socket2 = "=0.6.5"
songrec-lib = "=0.5.4"
