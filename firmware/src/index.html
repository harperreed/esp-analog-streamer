<!doctype html>
<!-- ABOUTME: The now-playing page the board serves at /: current song with cover art, state, loudness, history. -->
<!-- ABOUTME: Uses board-local shared scripts and styles; polls /api/state every 3 s and writes song fields as text. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>esp-shazam</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav><a href="/settings">Settings</a></nav>
  <p class="muted" id="status">connecting…</p>
  <section class="now" id="now" hidden>
    <img id="cover" alt="">
    <div>
      <div class="title" id="title"></div>
      <div id="artist"></div>
      <div class="muted" id="album"></div>
      <a id="link" target="_blank" rel="noopener">Open in Shazam</a>
    </div>
  </section>
  <p class="muted" id="idle">Nothing playing.</p>
  <section class="listen" aria-labelledby="listen-heading">
    <h2 id="listen-heading">Listen</h2>
    <audio id="player" controls preload="none"></audio>
    <p>Stream: <a id="stream-link" rel="noopener"></a></p>
    <p class="muted">Any player that takes a URL works: VLC, mpv, a browser, a radio app. Add <code>?exact=1</code> for a recorder that must get every byte.</p>
  </section>
  <section class="sonos" id="sonos-section" aria-labelledby="sonos-heading" hidden>
    <h2 id="sonos-heading">Sonos</h2>
    <label for="sonos-destination">Destination</label>
    <select id="sonos-destination" disabled><option value="">Choose a destination</option></select>
    <div class="controls">
      <button id="sonos-discover" type="button" disabled>Discover</button>
      <button id="sonos-select" type="button" disabled>Select</button>
      <button id="sonos-play" type="button" disabled>Play</button>
      <button id="sonos-stop" type="button" disabled>Stop</button>
    </div>
    <p>Status: <span id="sonos-status" role="status">connecting…</span></p>
    <p class="muted" id="sonos-active"></p>
    <p class="error" id="sonos-error" role="status"></p>
    <p class="muted" id="sonos-action-status" role="status"></p>
  </section>
  <section id="history-section">
    <h2 class="muted">History</h2>
    <ol id="history"></ol>
  </section>
</main>
<script src="/app.js" defer></script>
</body>
</html>
