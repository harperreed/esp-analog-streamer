[build]
target = "xtensa-esp32-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.5"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
# ldproxy 0.3.2 logs "Running ldproxy" at info level, and rustc reports any linker stderr as a
# warning. ldproxy 0.3.5 moved that line to debug but ships no prebuilt binary.
LDPROXY_LOG = "warn"
TOML_CFG = "require_cfg_present"
